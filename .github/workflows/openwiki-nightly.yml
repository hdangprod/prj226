name: OpenWiki Nightly Knowledge Sync

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) for Cold Path Notion knowledge synthesis
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_full_sync:
        description: 'Force full re-sync of all Notion pages'
        required: false
        default: 'false'
        type: boolean

jobs:
  synthesize:
    name: Synthesize Personal Knowledge Brain
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenWiki CLI
        run: pip install "openwiki>=0.1.0"

      - name: Verify OpenWiki installation
        run: openwiki --version

      - name: Run Personal Brain Sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENWIKI_OUTPUT_DIR: ./vault
        run: |
          echo "🧠 Starting OpenWiki Personal Brain sync..."
          openwiki personal --update --output ./vault
          echo "✅ OpenWiki sync complete. Files in vault:"
          ls -la ./vault/ || echo "(vault directory empty or not created)"

      - name: Set up Node.js (for vault indexer)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install vault indexer dependencies
        run: npm install @neondatabase/serverless

        # Note: This installs only the minimal Neon dependency,
        # not the full project dependencies, for speed.

      - name: Index OKF Vault into Neon pgvector
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          VAULT_DIR: ./vault
        run: |
          echo "📚 Indexing vault into Neon..."
          node scripts/index-vault-to-neon.js
          echo "✅ Vault indexing complete."

      - name: Commit vault files to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "OpenWiki Sync Bot"
          git add vault/ || true
          git diff --staged --quiet || git commit -m "chore(vault): nightly OpenWiki sync $(date +%Y-%m-%d)"
          git push || true

      - name: Send Telegram success notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          VAULT_COUNT=$(ls ./vault/*.md 2>/dev/null | wc -l || echo 0)
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🧠 <b>Nightly Knowledge Sync Complete</b>%0A%0A✅ ${VAULT_COUNT} wiki entries synthesized and indexed.%0A📅 $(date +%Y-%m-%d %H:%M UTC)" \
            -d "parse_mode=HTML"

      - name: Send Telegram failure alert
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=⚠️ <b>OpenWiki Nightly Sync Failed</b>%0A%0AThe nightly knowledge synthesis failed. Please check the logs.%0A%0A<a href=\"${RUN_URL}\">🔗 View Logs &amp; Re-run</a>" \
            -d "parse_mode=HTML"
