name = "prj226-liam"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = ""

# ─── Cloudflare D1 Database (5GB free, edge SQLite) ───
[[d1_databases]]
binding = "DB"
database_name = "prj226-brain"
database_id = "<YOUR_D1_ID>"

# ─── Cloudflare Vectorize (768-dim cosine, 30M dims free) ───
[[vectorize]]
binding = "VECTORIZE"
index_name = "prj226-wiki"

# ─── Cloudflare Workers AI (Whisper + Embeddings) ───
[ai]
binding = "AI"

# ─── Cloudflare KV (Debounce Buffer) ───
[[kv_namespaces]]
binding = "SESSION_KV"
id = "bf8509640dfa4d0fa87dd0a1d945c44a"

# ─── Cron Triggers ───
[triggers]
crons = [
  "*/5 * * * *"    # Flush pending_captures to GitHub every 5 min
]

# ─── Environment Variables (non-secret) ───
[vars]
GITHUB_OWNER = "hdangprod"
GITHUB_REPO = "hdangprod_wiki"
EMBEDDING_MODEL = "@cf/baai/bge-base-en-v1.5"
EMBEDDING_DIMENSIONS = "768"
TELEGRAM_BOT_USERNAME = "liam_second_brain_bot"
LLM_FAST_PROVIDER = "google"
LLM_FAST_MODEL = "gemini-3.5-flash-lite"
LLM_PRO_PROVIDER = "google"
LLM_PRO_MODEL = "gemini-3.6-flash"

# ─── Secrets (set via `wrangler secret put`) ───
# TELEGRAM_BOT_TOKEN
# TELEGRAM_WEBHOOK_SECRET
# TELEGRAM_CHAT_ID
# GITHUB_TOKEN             (GitHub PAT for Git Data API)
# GITHUB_WEBHOOK_SECRET    (HMAC-SHA256 for push webhooks)
# LLM_FAST_API_KEY         (Google Gemini API key)
# LLM_PRO_API_KEY          (Google Gemini API key)
